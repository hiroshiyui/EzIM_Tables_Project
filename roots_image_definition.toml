# EZ Roots SVG Image Definitions
#
# Each EZ key may carry MULTIPLE roots (字根).
# Primary root  : from ezsource12-3/header/gcin_ez_header.txt (%keyname).
# Secondary root: from the 輕鬆鍵盤圖 keyboard diagram
#                 (reference image: Documents/ezIME/IMG_20110203_211918.jpg).
#
# Schema per [[keys]] entry:
#   key   : the typed key (single character)
#   roots : ordered list; index 0 is the primary root.
#           each item:
#             char      — displayed glyph
#             codepoint — U+XXXX of `char`
#             svg_char  — character whose SVG is actually used
#             svg_file  — filename under makemeahanzi/svgs/
#             status    — "direct"      (makemeahanzi has `char` itself)
#                         "fallback"    (char is a Kangxi/CJK-radical codepoint
#                                       not in makemeahanzi; svg_char substitutes)
#                         "descriptive" (image composed from a subset of strokes
#                                       of a donor character; strokes inlined in
#                                       `strokes` as SVG path `d` values, sourced
#                                       from makemeahanzi/graphics.txt)
#                         "composite"   (image composed by stacking multiple
#                                       makemeahanzi glyphs, each optionally
#                                       transformed — e.g. one glyph nested
#                                       inside another)
#                         "missing"     (no SVG available; needs manual artwork)
#             note      — optional rationale
#
# Descriptive entries add these extra fields:
#   source_char     — donor character (e.g. "陳")
#   source_svg_file — donor's makemeahanzi svg filename (for reference)
#   stroke_indices  — 0-based indices into graphics.txt `strokes` array
#   strokes         — inline array of SVG path `d` values, in stroke order
# Consumers should assemble these paths inside an SVG canvas matching
# makemeahanzi's 1024×1024 viewBox ("0 0 1024 1024" with y-axis flipped via
# transform="scale(1 -1) translate(0 -900)" as makemeahanzi does).
#
# Composite entries use these extra fields:
#   components — ordered list of component glyphs; painted in order so later
#                items appear on top:
#                  char      — the component glyph
#                  svg_file  — its makemeahanzi svg filename
#                  transform — optional SVG transform applied to this component
#                              (evaluated inside the flipped outer group).

[meta]
primary_source   = "ezsource12-3/header/gcin_ez_header.txt"
secondary_source = "輕鬆鍵盤圖 diagram (IMG_20110203_211918.jpg)"
svg_source       = "makemeahanzi/svgs"
svg_naming       = "decimal-codepoint.svg (e.g. U+4E00 一 -> 19968.svg)"

